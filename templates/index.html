<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dbt-agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #1E40AF;
      --color-on-primary: #FFFFFF;
      --color-secondary: #3B82F6;
      --color-accent: #D97706;
      --color-accent-ink: #92400E;
      --color-accent-soft: #FFF7ED;
      --color-background: #F8FAFC;
      --color-foreground: #0F172A;
      --color-foreground-soft: #475569;
      --color-muted: #E9EEF6;
      --color-border: #DBEAFE;
      --color-border-strong: #BFDBFE;
      --color-destructive: #DC2626;
      --color-ring: #1E40AF;
      --color-ok: #047857;
      --color-ok-soft: #ECFDF5;
      --color-surface: #FFFFFF;
      --color-surface-2: #F1F5F9;
      --color-agent: #FFFFFF;
      --color-agent-ink: #0F172A;
      --color-agent-edge: #1E40AF;
      --color-user: #1E40AF;
      --color-user-ink: #FFFFFF;
      --color-activity-bg: #0B1220;
      --color-activity-line: #1E293B;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 20px rgba(30, 64, 175, 0.06);
      --radius: 10px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --font: "Fira Sans", "Segoe UI", sans-serif;
      --mono: "Fira Code", ui-monospace, Consolas, monospace;
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --dur: 180ms;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; min-height: 100%; }
    @supports (height: 100dvh) {
      html, body { height: 100dvh; min-height: 100dvh; }
    }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--color-foreground);
      background:
        linear-gradient(180deg, #EEF4FF 0%, var(--color-background) 42%, #F8FAFC 100%);
      -webkit-font-smoothing: antialiased;
    }
    button, a, [role="button"] { cursor: pointer; }
    button:disabled, input:disabled, textarea:disabled, select:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .shell {
      height: 100%;
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
      background: rgba(255,255,255,0.86);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(145deg, var(--color-primary), var(--color-secondary));
      color: #fff;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand h1 {
      margin: 0;
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--color-primary);
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--color-foreground-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 52ch;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-foreground-soft);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #94A3B8;
    }
    .status-chip.busy .status-dot {
      background: var(--color-accent);
      box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.55);
      animation: pulse-dot 1.4s ease-out infinite;
    }
    .status-chip.live .status-dot { background: #16A34A; }
    @keyframes pulse-dot {
      0% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(217, 119, 6, 0); }
      100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0); }
    }

    /* Layout — full-bleed dense console; equal-height columns, Engagement a bit wider */
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(620px, 1.2fr);
      gap: var(--space-4);
      padding: 12px 16px 16px;
      max-width: none;
      margin: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      min-height: 0;
      align-items: stretch;
    }

    .panel {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
      min-height: 0;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-border);
      background: linear-gradient(180deg, #FFFFFF, #F8FBFF);
      flex: 0 0 auto;
    }
    .panel-head h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-foreground-soft);
      font-family: var(--mono);
    }
    .panel-body { padding: 14px; }
    .side-col .panel-body > label,
    .side-col .panel-body > .row,
    .side-col .panel-body > .eng-toolbar,
    .side-col .panel-body > .busy-bar {
      flex: 0 0 auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .skip-link {
      position: absolute;
      left: 12px;
      top: 8px;
      z-index: 50;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--color-primary);
      color: var(--color-on-primary);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transform: translateY(-120%);
      transition: transform var(--dur) var(--ease);
    }
    .skip-link:focus {
      transform: translateY(0);
      outline: none;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.35);
    }

    .main-col,
    .side-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
    }
    .main-col { gap: 0; }
    .side-col { gap: 0; }
    .chat-panel,
    .side-col > .panel {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      height: 100%;
    }
    .side-col .panel-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .chat {
      flex: 1 1 auto;
      height: auto;
      min-height: 200px;
      max-height: none;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: linear-gradient(180deg, #F8FAFC 0%, #EEF2F7 100%);
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: var(--color-border-strong) transparent;
    }
    .chat::-webkit-scrollbar { width: 10px; }
    .chat::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb {
      background: var(--color-border-strong);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .chat::-webkit-scrollbar-thumb:hover { background: var(--color-secondary); }

    /* Messaging-style rows: Agent left, You right */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      width: 100%;
      animation: rise var(--dur) var(--ease);
    }
    .msg-row.assistant { justify-content: flex-start; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.system { justify-content: center; }

    .msg-avatar {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .msg-avatar svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    .msg-row.assistant .msg-avatar {
      background: #1E3A8A;
      color: #fff;
      order: 0;
    }
    .msg-row.user .msg-avatar {
      background: #D97706;
      color: #fff;
      order: 2;
    }
    .msg-row.system .msg-avatar { display: none; }

    .bubble {
      max-width: min(78%, 560px);
      padding: 10px 14px 12px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .bubble.assistant {
      background: var(--color-agent);
      border: 1px solid var(--color-border);
      border-left: 3px solid var(--color-agent-edge);
      color: var(--color-agent-ink);
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: var(--color-user);
      border: 1px solid #1E3A8A;
      color: var(--color-user-ink);
      border-bottom-right-radius: 4px;
    }
    .bubble.system {
      max-width: 92%;
      background: var(--color-accent-soft);
      border: 1px solid #FDBA74;
      color: var(--color-accent-ink);
      font-size: 13px;
      text-align: center;
      border-radius: 10px;
    }
    .bubble.error {
      border-color: #FECACA;
      background: #FEF2F2;
      color: #991B1B;
    }
    .msg-row.error .msg-avatar {
      background: var(--color-destructive);
    }
    .who {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-family: var(--mono);
    }
    .bubble.assistant .who { color: #1E40AF; }
    .bubble.user .who { color: rgba(255, 255, 255, 0.9); }
    .bubble.system .who { color: var(--color-accent-ink); justify-content: center; }
    .who-icon {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      display: block;
    }
    .bubble-body { color: inherit; }

    .prompt-box {
      flex: 0 0 auto;
      margin: 0 14px 14px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--color-border-strong);
      background: linear-gradient(180deg, #FFFFFF, #F8FBFF);
    }
    .prompt-box.hidden { display: none; }
    .prompt-q {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 12px;
      color: var(--color-primary);
      line-height: 1.4;
    }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choices button {
      width: auto;
      min-width: 120px;
      flex: 1 1 auto;
      text-align: left;
      background: #fff;
      color: var(--color-foreground);
      border: 1px solid var(--color-border);
      padding: 11px 12px;
      border-radius: 8px;
      font-weight: 600;
      transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .choices button:hover:not(:disabled) {
      border-color: var(--color-secondary);
      background: #EFF6FF;
      color: var(--color-primary);
      transform: translateY(-1px);
    }
    .choices button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.25);
    }
    .choices button.yes { border-color: #86EFAC; background: var(--color-ok-soft); color: #065F46; }
    .choices button.no { border-color: #FECACA; background: #FEF2F2; color: #991B1B; }

    .composer {
      flex: 0 0 auto;
      padding: 0 14px 14px;
    }
    .composer.hidden { display: none; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-foreground-soft);
      margin: 0 0 6px;
      letter-spacing: 0.01em;
    }
    input, textarea, select, button {
      font-family: var(--font);
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-foreground);
      padding: 10px 12px;
      width: 100%;
      transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--color-secondary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.22);
    }
    textarea { min-height: 72px; resize: vertical; line-height: 1.45; }
    button {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-on-primary);
      font-weight: 600;
    }
    button:hover:not(:disabled) { filter: brightness(1.06); }
    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.28);
    }
    button.ghost {
      background: var(--color-surface);
      color: var(--color-foreground);
      border-color: var(--color-border);
    }
    button.ghost:hover:not(:disabled) {
      filter: none;
      background: var(--color-muted);
      border-color: var(--color-border-strong);
    }
    button.ok {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #fff;
    }
    button.ok:hover:not(:disabled) { filter: brightness(1.05); }
    .row { display: flex; gap: 8px; align-items: stretch; }
    .row > * { flex: 1; }

    .path-input {
      font-family: var(--mono);
      font-size: 12.5px;
    }
    .busy-bar {
      display: none;
      margin-top: 10px;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--color-accent-soft);
      border: 1px solid #FDBA74;
      color: var(--color-accent-ink);
    }
    .busy-bar.on { display: flex; }
    .busy-bar .msg { flex: 1; font-size: 13px; font-weight: 600; }
    .busy-bar .spin {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(146, 64, 14, 0.25);
      border-top-color: var(--color-accent-ink);
      animation: spin .8s linear infinite;
      flex: 0 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .eng-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .activity-toggle {
      flex: 0 0 auto;
      width: auto;
      padding: 8px 12px;
      font-size: 12px;
      background: var(--color-surface);
      color: var(--color-foreground);
      border-color: var(--color-border-strong);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
    }
    .activity-toggle:hover:not(:disabled) {
      filter: none;
      background: var(--color-muted);
    }
    .activity-toggle[aria-expanded="true"] {
      border-color: var(--color-secondary);
      background: #EFF6FF;
      color: var(--color-primary);
    }
    .activity-toggle svg { width: 14px; height: 14px; }

    .activity-panel {
      display: none;
      margin-top: 10px;
      border: 1px solid #1E293B;
      border-radius: 8px;
      background: var(--color-activity-bg);
      color: #E2E8F0;
      flex: 1 1 auto;
      min-height: 200px;
      max-height: none;
      overflow: hidden;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
    }
    .activity-panel.on {
      display: flex;
      flex-direction: column;
    }
    .activity-panel[hidden] {
      display: none !important;
    }
    .activity-panel .head {
      position: sticky; top: 0;
      flex: 0 0 auto;
      padding: 8px 12px;
      background: #111827;
      border-bottom: 1px solid var(--color-activity-line);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94A3B8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #activityLines {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #FBBF24;
      font-size: 10px;
      letter-spacing: 0.04em;
    }
    .live-badge i {
      width: 6px; height: 6px; border-radius: 50%;
      background: #FBBF24;
      display: inline-block;
    }
    .activity-panel .line {
      padding: 7px 12px;
      border-bottom: 1px solid var(--color-activity-line);
      transition: background var(--dur) var(--ease);
    }
    .activity-panel .line:hover { background: rgba(255,255,255,0.03); }
    .activity-panel .line:last-child { border-bottom: 0; }
    .activity-panel .run-block {
      border-bottom: 1px solid #334155;
    }
    .activity-panel .run-block:last-child { border-bottom: 0; }
    .activity-panel .run-head {
      position: sticky;
      top: 33px;
      z-index: 1;
      padding: 8px 12px;
      background: #0F172A;
      border-bottom: 1px solid #334155;
      color: #FBBF24;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
    }
    .activity-panel .run-head .run-time {
      color: #64748B;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }
    .activity-panel .run-head.current {
      background: #172554;
      color: #93C5FD;
      border-left: 3px solid var(--color-secondary);
    }
    .activity-panel .k-brain { color: #67E8F9; }
    .activity-panel .k-thinking {
      color: #FCD34D;
      background: #111827;
      border-left: 3px solid var(--color-accent);
    }
    .activity-panel .k-thinking .detail {
      color: #F8FAFC;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
      max-height: 260px;
      overflow-y: auto;
      overscroll-behavior: contain;
      white-space: pre-wrap;
      margin-top: 6px;
      scrollbar-width: thin;
    }
    .activity-panel .k-tool { color: #93C5FD; }
    .activity-panel .k-error { color: #FCA5A5; }
    .activity-panel .k-info,
    .activity-panel .k-event { color: #CBD5E1; }
    .activity-panel .detail {
      color: #94A3B8;
      display: block;
      margin-top: 2px;
      white-space: pre-wrap;
      max-height: 220px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .form-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--color-border);
    }
    .form-section h3 {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-foreground-soft);
      font-family: var(--mono);
    }
    .check-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
    .check-row input { width: auto; }
    .check-row label { margin: 0; font-weight: 500; color: var(--color-foreground); }
    .hint { font-size: 11px; color: var(--color-foreground-soft); margin-top: 4px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .meta-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }
    .meta-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
    }
    .meta-list span { color: var(--color-foreground-soft); }
    .meta-list strong {
      font-family: var(--mono);
      font-weight: 600;
      color: var(--color-primary);
      text-align: right;
    }

    @media (max-width: 1400px) {
      .workspace { grid-template-columns: minmax(0, 1fr) minmax(540px, 1.15fr); }
    }
    @media (max-width: 1200px) {
      .workspace { grid-template-columns: minmax(0, 1fr) minmax(480px, 1.1fr); }
    }
    @media (max-width: 1024px) {
      .shell { height: auto; min-height: 100%; overflow: visible; }
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
      }
      .side-col { order: -1; }
      .main-col,
      .side-col,
      .chat-panel,
      .side-col > .panel {
        height: auto;
      }
      .chat {
        flex: none;
        height: min(420px, 55vh);
        max-height: min(420px, 55vh);
      }
      .activity-panel {
        flex: none;
        max-height: min(420px, 50vh);
        min-height: 240px;
      }
      .activity-panel.on { display: block; }
      #activityLines { overflow: visible; max-height: none; }
    }
    @media (max-width: 640px) {
      .workspace { padding: 10px 12px 16px; gap: 12px; }
      .topbar { padding: 10px 12px; }
      .brand p { display: none; }
      .grid2 { grid-template-columns: 1fr; }
      .msg-row .bubble { max-width: calc(100% - 46px); }
      .msg-avatar { flex-basis: 32px; width: 32px; height: 32px; }
      .msg-avatar svg { width: 18px; height: 18px; }
      .chat {
        height: min(320px, 50vh);
        max-height: min(320px, 50vh);
      }
      .activity-panel {
        max-height: min(320px, 45vh);
        min-height: 200px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#chat">Skip to conversation</a>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M4 12h10M4 17h14"/>
            <circle cx="18" cy="12" r="2.5"/>
          </svg>
        </div>
        <div>
          <h1>dbt-agent</h1>
          <p>Engagement operator console — brain, warehouse, delivery in one chat flow.</p>
        </div>
      </div>
      <div class="status-chip" id="statusChip" title="Run status" aria-live="polite" aria-atomic="true">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusLabel">Idle</span>
      </div>
    </header>

    <div class="workspace">
      <div class="main-col">
        <section class="panel chat-panel" aria-labelledby="convHeading">
          <div class="panel-head">
            <h2 id="convHeading">Conversation</h2>
          </div>
          <div class="chat" id="chat" aria-live="polite" tabindex="-1"></div>
          <div id="alertRegion" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>

          <div class="prompt-box hidden" id="promptBox">
            <div class="prompt-q" id="promptQuestion"></div>
            <div class="choices" id="promptChoices"></div>
            <div id="promptForm"></div>
          </div>

          <div class="composer" id="composer">
            <label class="sr-only" for="message">Message</label>
            <textarea id="message" placeholder="Type when the agent asks for free text…" aria-describedby="composerHint"></textarea>
            <p id="composerHint" class="sr-only">Press Enter to send, Shift+Enter for a new line.</p>
            <div class="row" style="margin-top:10px;">
              <button type="button" class="ok" id="btnSend" onclick="sendMessage()">Send</button>
            </div>
          </div>
        </section>
      </div>

      <aside class="side-col">
        <section class="panel" aria-labelledby="engHeading">
          <div class="panel-head">
            <h2 id="engHeading">Engagement</h2>
          </div>
          <div class="panel-body">
            <label for="projectDir">Folder path</label>
            <div class="row">
              <input class="path-input" id="projectDir" value="" placeholder="C:\path\to\engagement" autocomplete="off" />
              <button type="button" class="ok" id="btnOpen" style="flex:0 0 96px;" onclick="saveProject()">Open</button>
            </div>
            <div class="eng-toolbar">
              <button
                type="button"
                class="activity-toggle"
                id="btnActivity"
                onclick="toggleActivity()"
                aria-expanded="false"
                aria-controls="activityPanel"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M4 19V5M10 19V9M16 19V3M22 19H2"/>
                </svg>
                Activity
              </button>
            </div>
            <div class="busy-bar" id="busyBanner" role="status" aria-live="polite" aria-atomic="true">
              <div class="spin" aria-hidden="true"></div>
              <div class="msg" id="busyText">Working…</div>
            </div>
            <div class="activity-panel" id="activityPanel" aria-label="Live activity" hidden>
              <div class="head">
                <span>Activity history</span>
                <span class="live-badge"><i></i>RUNS</span>
              </div>
              <div id="activityLines"></div>
            </div>
          </div>
        </section>
      </aside>
    </div>
  </div>

<script>
let busy = false;
let activePrompt = null;
let activityOpen = false;
let activityTimer = null;
let activitySince = 0;

function setStatus(mode, label) {
  const chip = document.getElementById('statusChip');
  chip.classList.remove('busy', 'live');
  if (mode) chip.classList.add(mode);
  document.getElementById('statusLabel').textContent = label;
}

function setBusy(on, reason) {
  busy = !!on;
  const banner = document.getElementById('busyBanner');
  banner.classList.toggle('on', busy);
  document.getElementById('busyText').textContent = reason || 'Working… please wait.';
  setStatus(busy ? 'busy' : 'idle', busy ? 'Running' : 'Idle');
  ['projectDir', 'btnOpen', 'message', 'btnSend'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = busy;
  });
  document.querySelectorAll('#promptBox button, #promptBox input, #promptBox select, #promptBox textarea').forEach(b => {
    b.disabled = busy;
  });
  if (busy) {
    activitySince = Date.now() / 1000 - 1;
    startActivityPoll();
  } else {
    stopActivityPoll();
    refreshActivity(true);
  }
}

function setActivityOpen(open) {
  activityOpen = !!open;
  const panel = document.getElementById('activityPanel');
  const btn = document.getElementById('btnActivity');
  if (panel) {
    panel.classList.toggle('on', activityOpen);
    panel.hidden = !activityOpen;
  }
  if (btn) btn.setAttribute('aria-expanded', activityOpen ? 'true' : 'false');
  if (activityOpen) {
    // Pin to latest after the panel becomes visible (layout needs a frame)
    requestAnimationFrame(() => scrollActivityToLatest(true));
  }
}

function toggleActivity() {
  setActivityOpen(!activityOpen);
  if (activityOpen) refreshActivity(true);
}

function startActivityPoll() {
  stopActivityPoll();
  refreshActivity(true);
  activityTimer = setInterval(() => refreshActivity(false), 900);
}

function stopActivityPoll() {
  if (activityTimer) {
    clearInterval(activityTimer);
    activityTimer = null;
  }
}

async function refreshActivity(force) {
  if (!force && !busy && !activityOpen) return;
  const project_dir = document.getElementById('projectDir').value.trim();
  if (!project_dir) return;
  try {
    const res = await fetch(`/api/activity?project_dir=${encodeURIComponent(project_dir)}`);
    const j = await res.json();
    if (!j.ok) return;
    renderActivity(j.entries || []);
  } catch (_) { /* ignore */ }
}

function activityNearBottom(host) {
  if (!host) return true;
  // Prefer pinning while the operator is already following the tail
  return (host.scrollHeight - host.scrollTop - host.clientHeight) < 120;
}

function scrollActivityToLatest(force) {
  const host = document.getElementById('activityLines');
  if (!host) return;
  if (!force && !busy && !activityNearBottom(host)) return;

  const pin = () => {
    // Nested detail panes (thinking / tool dumps) → latest lines
    host.querySelectorAll('.detail').forEach((el) => {
      if (el.scrollHeight > el.clientHeight + 2) {
        el.scrollTop = el.scrollHeight;
      }
    });
    // #activityLines is the scroll container (panel is overflow:hidden)
    host.scrollTop = host.scrollHeight;
    const last = host.querySelector('.run-block:last-child, .line:last-child');
    if (last && typeof last.scrollIntoView === 'function') {
      last.scrollIntoView({ block: 'end', inline: 'nearest', behavior: 'auto' });
    }
    host.scrollTop = host.scrollHeight;
  };

  // innerHTML just landed — wait for layout before measuring scrollHeight
  requestAnimationFrame(() => {
    pin();
    requestAnimationFrame(pin);
  });
}

function renderActivity(entries) {
  const host = document.getElementById('activityLines');
  if (!entries.length) {
    host.innerHTML = '<div class="line k-info">Waiting for events…</div>';
    return;
  }
  const stick = busy || activityNearBottom(host) || !host.dataset.hasContent;
  const hasLive = entries.some(e => e.live);
  setStatus(busy ? 'busy' : (hasLive ? 'live' : 'idle'), busy ? 'Running' : (hasLive ? 'Streaming' : 'Idle'));

  // Group into run sections (same activity area, sectioned history)
  const runs = [];
  let current = null;
  entries.forEach(e => {
    if (e.kind === 'run') {
      current = {
        id: e.run_id || ('run-' + runs.length),
        label: e.run_label || e.message || 'Run',
        detail: e.detail || '',
        ts: e.ts,
        lines: [],
      };
      runs.push(current);
      return;
    }
    if (!current) {
      current = {
        id: e.run_id || 'run-legacy',
        label: e.run_label || 'Earlier activity',
        detail: '',
        ts: e.ts,
        lines: [],
      };
      runs.push(current);
    }
    current.lines.push(e);
  });

  const lastId = runs.length ? runs[runs.length - 1].id : null;
  host.innerHTML = runs.map(run => {
    const isCurrent = run.id === lastId;
    const t = (run.ts || '').slice(11, 19);
    const detail = run.detail
      ? `<div class="detail" style="margin:0;opacity:.75;text-transform:none;letter-spacing:0;font-weight:500;">${escapeHtml(run.detail)}</div>`
      : '';
    const lines = run.lines.map(e => {
      const cls = `k-${e.kind || 'info'}`;
      const agent = e.agent ? `[${e.agent}] ` : '';
      const live = e.live ? ' <span style="opacity:.7">(live)</span>' : '';
      const lineDetail = e.detail ? `<span class="detail">${escapeHtml(e.detail)}</span>` : '';
      const lt = (e.ts || '').slice(11, 19);
      return `<div class="line ${cls}"><span style="opacity:.55">${lt}</span> ${escapeHtml(agent + (e.message || ''))}${live}${lineDetail}</div>`;
    }).join('');
    return `<div class="run-block">
      <div class="run-head ${isCurrent ? 'current' : ''}">
        <span>Run · ${escapeHtml(run.label)}${isCurrent ? ' · current' : ''}</span>
        <span class="run-time">${t}</span>
      </div>
      ${detail}
      ${lines || '<div class="line k-info">No events yet…</div>'}
    </div>`;
  }).join('');
  host.dataset.hasContent = '1';

  if (busy || activityOpen) {
    setActivityOpen(true);
    if (stick || busy || hasLive) scrollActivityToLatest(true);
  }
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function svgIcon(kind) {
  /* Inline Phosphor-style outlines — robot (agent) / user (human) / gear (system) */
  const icons = {
    robot: '<svg class="who-icon" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="52" y="84" width="152" height="116" rx="24"/><path d="M128 36v48"/><circle cx="128" cy="28" r="12" fill="currentColor" stroke="none"/><circle cx="96" cy="132" r="12" fill="currentColor" stroke="none"/><circle cx="160" cy="132" r="12" fill="currentColor" stroke="none"/><path d="M96 172h64"/><path d="M52 128H28a16 16 0 0 0-16 16v16a16 16 0 0 0 16 16h24"/><path d="M204 128h24a16 16 0 0 1 16 16v16a16 16 0 0 1-16 16h-24"/></svg>',
    user: '<svg class="who-icon" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="128" cy="96" r="64"/><path d="M32 216c18-40 58-64 96-64s78 24 96 64"/></svg>',
    system: '<svg class="who-icon" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="128" cy="128" r="40"/><path d="M128 36v24M128 196v24M36 128h24M196 128h24M60 60l17 17M179 179l17 17M196 60l-17 17M77 179l-17 17"/></svg>',
  };
  const wrap = document.createElement('span');
  wrap.innerHTML = icons[kind] || icons.system;
  return wrap.firstChild;
}

function announceAlert(text) {
  const region = document.getElementById('alertRegion');
  if (!region) return;
  region.textContent = '';
  // Force a DOM change so assertive live regions re-announce
  window.setTimeout(() => {
    region.textContent = String(text || '');
  }, 20);
}

function addMsg(role, text, opts) {
  const options = opts || {};
  const isError = !!options.error;
  const c = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = `msg-row ${role}${isError ? ' error' : ''}`;
  const label = role === 'user' ? 'You' : (role === 'system' ? 'System' : 'Agent');
  row.setAttribute('role', isError ? 'alert' : 'group');
  row.setAttribute('aria-label', isError ? `Error from ${label}` : label);

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.setAttribute('aria-hidden', 'true');
  const iconKind = role === 'user' ? 'user' : (role === 'system' ? 'system' : 'robot');
  avatar.appendChild(svgIcon(iconKind));

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}${isError ? ' error' : ''}`;

  const body = document.createElement('div');
  body.className = 'bubble-body';
  body.textContent = text;

  bubble.appendChild(body);
  row.appendChild(avatar);
  row.appendChild(bubble);
  c.appendChild(row);
  c.scrollTop = c.scrollHeight;
  if (isError) announceAlert(text);
}

function fieldInput(f, values) {
  const wrap = document.createElement('div');
  const id = `field_${String(f.key || 'x').replace(/[^a-zA-Z0-9_-]/g, '_')}`;
  const lab = document.createElement('label');
  lab.htmlFor = id;
  lab.textContent = f.label + (f.required ? ' *' : '');
  wrap.appendChild(lab);
  const input = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
  input.id = id;
  if (f.type !== 'textarea') input.type = f.type === 'password' ? 'password' : 'text';
  input.dataset.key = f.key;
  input.placeholder = f.default || '';
  if (f.required) input.required = true;
  if (values && values[f.key] != null && f.type !== 'password') input.value = values[f.key];
  else if (f.default && f.type !== 'password') input.value = f.default;
  wrap.appendChild(input);
  return wrap;
}

function clearPrompt() {
  activePrompt = null;
  document.getElementById('promptBox').classList.add('hidden');
  document.getElementById('promptChoices').innerHTML = '';
  document.getElementById('promptForm').innerHTML = '';
  document.getElementById('promptQuestion').textContent = '';
  document.getElementById('composer').classList.remove('hidden');
  document.getElementById('message').placeholder = 'Type when the agent asks for free text…';
}

function renderPrompt(prompt) {
  clearPrompt();
  if (!prompt || !prompt.kind) return;
  activePrompt = prompt;
  const box = document.getElementById('promptBox');
  const q = document.getElementById('promptQuestion');
  const choices = document.getElementById('promptChoices');
  const formHost = document.getElementById('promptForm');
  const composer = document.getElementById('composer');
  q.textContent = prompt.question || '';
  box.classList.remove('hidden');

  if (prompt.kind === 'text') {
    composer.classList.remove('hidden');
    document.getElementById('message').placeholder = prompt.question || 'Type your answer…';
    (prompt.choices || []).forEach(ch => {
      const btn = document.createElement('button');
      const value = ch.value != null ? String(ch.value) : String(ch.label || '');
      const label = ch.label != null ? String(ch.label) : value;
      btn.textContent = label;
      if (value.toLowerCase() === 'yes') btn.classList.add('yes');
      btn.onclick = () => sendChoice(value, label);
      choices.appendChild(btn);
    });
    document.getElementById('message').focus();
    return;
  }
  if (prompt.kind === 'yes_no' || prompt.kind === 'choice') {
    composer.classList.add('hidden');
    (prompt.choices || []).forEach(ch => {
      const btn = document.createElement('button');
      const value = ch.value != null ? String(ch.value) : String(ch.label || '');
      const label = ch.label != null ? String(ch.label) : value;
      btn.textContent = label;
      if (prompt.kind === 'yes_no') {
        if (value.toLowerCase() === 'yes') btn.classList.add('yes');
        if (value.toLowerCase() === 'no') btn.classList.add('no');
      }
      btn.onclick = () => sendChoice(value, label);
      choices.appendChild(btn);
    });
    return;
  }
  if (prompt.kind === 'brain_form') {
    composer.classList.add('hidden');
    renderBrainForm(formHost, prompt.schema || {});
    return;
  }
  if (prompt.kind === 'confidence_form') {
    composer.classList.add('hidden');
    renderConfidenceForm(formHost, prompt.schema || {});
    return;
  }
  if (prompt.kind === 'warehouse_type_form') {
    composer.classList.add('hidden');
    renderWarehouseTypeForm(formHost, prompt.schema || {});
    return;
  }
  if (prompt.kind === 'connection_form') {
    composer.classList.add('hidden');
    renderConnectionForm(formHost, prompt.schema || {});
  }
}

function renderConfidenceForm(host, schema) {
  const presets = schema.presets || [];
  const help = document.createElement('div');
  help.className = 'hint';
  help.textContent = schema.help || 'Ask clarifying questions when path confidence is below this %.';
  host.appendChild(help);

  const lab = document.createElement('label');
  lab.textContent = 'Confidence threshold';
  lab.style.marginTop = '12px';
  host.appendChild(lab);

  const sel = document.createElement('select');
  sel.id = 'confidencePreset';
  presets.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.label;
    if (String(p.id) === String(schema.preset)) opt.selected = true;
    sel.appendChild(opt);
  });
  const customOpt = document.createElement('option');
  customOpt.value = 'custom';
  customOpt.textContent = 'Custom…';
  if (schema.preset === 'custom') customOpt.selected = true;
  sel.appendChild(customOpt);
  host.appendChild(sel);

  const customWrap = document.createElement('div');
  customWrap.id = 'confidenceCustomWrap';
  customWrap.style.marginTop = '12px';
  const customLab = document.createElement('label');
  customLab.textContent = 'Custom % (1–100)';
  customWrap.appendChild(customLab);
  const customInput = document.createElement('input');
  customInput.type = 'number';
  customInput.id = 'confidenceCustom';
  customInput.min = '1';
  customInput.max = '100';
  customInput.step = '1';
  customInput.value = String(schema.threshold != null ? schema.threshold : (schema.default || 70));
  customWrap.appendChild(customInput);
  host.appendChild(customWrap);

  function syncCustom() {
    customWrap.style.display = sel.value === 'custom' ? 'block' : 'none';
  }
  sel.onchange = syncCustom;
  syncCustom();

  const save = document.createElement('button');
  save.className = 'ok';
  save.style.marginTop = '14px';
  save.textContent = 'Continue';
  save.onclick = submitConfidenceForm;
  host.appendChild(save);
}

async function submitConfidenceForm() {
  if (busy) return;
  const preset = document.getElementById('confidencePreset').value;
  let threshold = preset;
  if (preset === 'custom') {
    threshold = document.getElementById('confidenceCustom').value;
  }
  if (!threshold) {
    addMsg('system', 'Pick a confidence threshold first.');
    return;
  }
  clearPrompt();
  addMsg('user', `Path confidence threshold: ${threshold}%`);
  setBusy(true, 'Saving confidence threshold…');
  setActivityOpen(true);
  try {
    const project_dir = document.getElementById('projectDir').value.trim();
    const res = await fetch('/api/confidence', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project_dir, threshold})
    });
    const j = await res.json();
    if (!j.ok) { addMsg('assistant', j.error || 'Failed', { error: true }); return; }
    addMsg('assistant', j.reply);
    if (j.activity) renderActivity(j.activity);
    renderPrompt(j.prompt);
  } catch (err) {
    addMsg('assistant', `Error: ${err}`, { error: true });
  } finally {
    setBusy(false);
  }
}

function renderWarehouseTypeForm(host, schema) {
  const types = schema.warehouse_types || [];
  const srcLab = document.createElement('label');
  srcLab.textContent = 'Source warehouse';
  host.appendChild(srcLab);
  const srcSel = document.createElement('select');
  srcSel.id = 'whSourceType';
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = 'Select source type…';
  placeholder.disabled = true;
  placeholder.selected = !schema.source_type;
  srcSel.appendChild(placeholder);
  types.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = t.label + (t.enabled ? '' : ' — coming soon');
    opt.disabled = !t.enabled;
    if (t.id === schema.source_type) opt.selected = true;
    srcSel.appendChild(opt);
  });
  host.appendChild(srcSel);

  const sameRow = document.createElement('div');
  sameRow.className = 'check-row';
  sameRow.style.marginTop = '12px';
  const same = document.createElement('input');
  same.type = 'checkbox';
  same.id = 'whTargetSame';
  same.checked = schema.target_same_as_source !== false;
  const sameLab = document.createElement('label');
  sameLab.htmlFor = 'whTargetSame';
  sameLab.textContent = 'Target is the same as source';
  sameRow.appendChild(same);
  sameRow.appendChild(sameLab);
  host.appendChild(sameRow);

  const tgtWrap = document.createElement('div');
  tgtWrap.id = 'whTargetWrap';
  tgtWrap.style.marginTop = '12px';
  const tgtLab = document.createElement('label');
  tgtLab.textContent = 'Target warehouse';
  tgtWrap.appendChild(tgtLab);
  const tgtSel = document.createElement('select');
  tgtSel.id = 'whTargetType';
  types.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = t.label + (t.enabled ? '' : ' — coming soon');
    opt.disabled = !t.enabled;
    if (t.id === (schema.target_type || schema.source_type)) opt.selected = true;
    tgtSel.appendChild(opt);
  });
  tgtWrap.appendChild(tgtSel);
  host.appendChild(tgtWrap);

  function syncTarget() {
    tgtWrap.style.display = same.checked ? 'none' : 'block';
  }
  same.onchange = syncTarget;
  syncTarget();

  const save = document.createElement('button');
  save.className = 'ok';
  save.style.marginTop = '14px';
  save.textContent = 'Continue';
  save.onclick = submitWarehouseTypeForm;
  host.appendChild(save);
}

async function submitWarehouseTypeForm() {
  if (busy) return;
  const source_type = document.getElementById('whSourceType').value;
  if (!source_type) {
    addMsg('system', 'Pick a source warehouse type first.');
    return;
  }
  const target_same = document.getElementById('whTargetSame').checked;
  const target_type = target_same
    ? source_type
    : document.getElementById('whTargetType').value;
  clearPrompt();
  addMsg('user', `Source warehouse: ${source_type}`);
  setBusy(true, 'Saving warehouse type…');
  setActivityOpen(true);
  try {
    const project_dir = document.getElementById('projectDir').value.trim();
    const res = await fetch('/api/warehouse-type', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        project_dir,
        source_type,
        target_type,
        TARGET_SAME_AS_SOURCE: target_same ? 'true' : 'false',
      })
    });
    const j = await res.json();
    if (!j.ok) { addMsg('assistant', j.error || 'Failed', { error: true }); return; }
    addMsg('assistant', j.reply);
    if (j.activity) renderActivity(j.activity);
    renderPrompt(j.prompt);
  } catch (err) {
    addMsg('assistant', `Error: ${err}`, { error: true });
  } finally {
    setBusy(false);
  }
}

function renderBrainForm(host, schema) {
  const providers = schema.providers || [];
  const values = schema.values || {};
  const secretsSet = schema.secrets_set || {};
  const typeLab = document.createElement('label');
  typeLab.textContent = 'Provider';
  host.appendChild(typeLab);
  const sel = document.createElement('select');
  sel.id = 'brainProvider';
  providers.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.label + (p.enabled ? '' : ' — coming soon');
    opt.disabled = !p.enabled;
    if (p.id === (schema.provider || 'cursor')) opt.selected = true;
    sel.appendChild(opt);
  });
  host.appendChild(sel);
  const fieldsHost = document.createElement('div');
  fieldsHost.id = 'brainFields';
  fieldsHost.className = 'grid2';
  fieldsHost.style.marginTop = '10px';
  host.appendChild(fieldsHost);
  function paintFields() {
    fieldsHost.innerHTML = '';
    const provider = providers.find(p => p.id === sel.value) || providers[0];
    (provider.fields || []).forEach(f => {
      const el = fieldInput(f, values);
      if (f.type === 'password' && secretsSet[f.key]) {
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = 'Already set — leave blank to keep.';
        el.appendChild(hint);
      }
      fieldsHost.appendChild(el);
    });
  }
  sel.onchange = paintFields;
  paintFields();
  const save = document.createElement('button');
  save.className = 'ok';
  save.style.marginTop = '14px';
  save.textContent = 'Continue';
  save.onclick = submitBrainForm;
  host.appendChild(save);
}

async function submitBrainForm() {
  if (busy) return;
  const provider = document.getElementById('brainProvider').value;
  const values = {};
  document.querySelectorAll('#brainFields [data-key]').forEach(el => {
    if (el.value.trim()) values[el.dataset.key] = el.value.trim();
  });
  clearPrompt();
  addMsg('user', 'Continue with brain settings');
  setBusy(true, 'Checking brain…');
  setActivityOpen(true);
  try {
    const project_dir = document.getElementById('projectDir').value.trim();
    const res = await fetch('/api/brain', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project_dir, provider, values})
    });
    const j = await res.json();
    if (!j.ok) { addMsg('assistant', j.error || 'Failed', { error: true }); return; }
    addMsg('assistant', j.reply);
    if (j.activity) renderActivity(j.activity);
    renderPrompt(j.prompt);
  } catch (err) {
    addMsg('assistant', `Error: ${err}`, { error: true });
  } finally {
    setBusy(false);
  }
}

function renderConnectionForm(host, schema) {
  const values = schema.values || {};
  const types = schema.warehouse_types || [];
  const typeLabel = (id) => {
    const t = types.find(x => x.id === id);
    return (t && t.label) || id || '—';
  };

  const common = document.createElement('div');
  common.className = 'form-section';
  common.innerHTML = '<h3>Project</h3>';
  const commonGrid = document.createElement('div');
  commonGrid.className = 'grid2';
  (schema.common_fields || []).forEach(f => commonGrid.appendChild(fieldInput(f, values)));
  common.appendChild(commonGrid);
  host.appendChild(common);

  const src = document.createElement('div');
  src.className = 'form-section';
  src.innerHTML = '<h3>Source</h3>';
  const srcTypeHint = document.createElement('div');
  srcTypeHint.className = 'hint';
  srcTypeHint.textContent = 'Warehouse: ' + typeLabel(schema.source_type);
  src.appendChild(srcTypeHint);
  const srcType = document.createElement('input');
  srcType.type = 'hidden';
  srcType.id = 'sourceType';
  srcType.value = schema.source_type || 'postgres';
  src.appendChild(srcType);
  const srcFields = document.createElement('div');
  srcFields.id = 'sourceFields';
  srcFields.className = 'grid2';
  srcFields.style.marginTop = '10px';
  src.appendChild(srcFields);
  host.appendChild(src);

  const sameRow = document.createElement('div');
  sameRow.className = 'check-row form-section';
  const same = document.createElement('input');
  same.type = 'checkbox';
  same.id = 'targetSame';
  same.checked = !!schema.target_same_as_source;
  const sameLab = document.createElement('label');
  sameLab.htmlFor = 'targetSame';
  sameLab.textContent = 'Target is the same as source';
  sameRow.appendChild(same);
  sameRow.appendChild(sameLab);
  host.appendChild(sameRow);

  const tgt = document.createElement('div');
  tgt.className = 'form-section';
  tgt.id = 'targetSection';
  tgt.innerHTML = '<h3>Target</h3>';
  const tgtTypeHint = document.createElement('div');
  tgtTypeHint.className = 'hint';
  tgtTypeHint.textContent = 'Warehouse: ' + typeLabel(schema.target_type || schema.source_type);
  tgt.appendChild(tgtTypeHint);
  const tgtType = document.createElement('input');
  tgtType.type = 'hidden';
  tgtType.id = 'targetType';
  tgtType.value = schema.target_type || schema.source_type || 'postgres';
  tgt.appendChild(tgtType);
  const tgtFields = document.createElement('div');
  tgtFields.id = 'targetFields';
  tgtFields.className = 'grid2';
  tgtFields.style.marginTop = '10px';
  tgt.appendChild(tgtFields);
  host.appendChild(tgt);

  function paintSource() {
    srcFields.innerHTML = '';
    (schema.source_fields || []).forEach(f => srcFields.appendChild(fieldInput(f, values)));
  }
  function paintTarget() {
    tgtFields.innerHTML = '';
    (schema.target_fields || []).forEach(f => tgtFields.appendChild(fieldInput(f, values)));
    tgt.style.display = same.checked ? 'none' : 'block';
  }
  same.onchange = paintTarget;
  paintSource();
  paintTarget();

  const save = document.createElement('button');
  save.className = 'ok';
  save.style.marginTop = '14px';
  save.textContent = 'Continue';
  save.onclick = submitConnectionForm;
  host.appendChild(save);
}

async function submitConnectionForm() {
  if (busy) return;
  const values = {};
  document.querySelectorAll('#promptForm [data-key]').forEach(el => {
    if (el.value.trim()) values[el.dataset.key] = el.value.trim();
  });
  values.SOURCE_WAREHOUSE_TYPE = document.getElementById('sourceType').value;
  values.TARGET_WAREHOUSE_TYPE = document.getElementById('targetType').value;
  values.TARGET_SAME_AS_SOURCE = document.getElementById('targetSame').checked ? 'true' : 'false';
  clearPrompt();
  addMsg('user', 'Continue with connection settings');
  setBusy(true, 'Checking warehouse link…');
  setActivityOpen(true);
  try {
    const project_dir = document.getElementById('projectDir').value.trim();
    const res = await fetch('/api/connection', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project_dir, values})
    });
    const j = await res.json();
    if (!j.ok) { addMsg('assistant', j.error || 'Failed', { error: true }); return; }
    addMsg('assistant', j.reply);
    if (j.activity) renderActivity(j.activity);
    renderPrompt(j.prompt);
  } catch (err) {
    addMsg('assistant', `Error: ${err}`, { error: true });
  } finally {
    setBusy(false);
  }
}

async function saveProject() {
  if (busy) { addMsg('system', 'Still working — wait a moment.'); return; }
  const project_dir = document.getElementById('projectDir').value.trim();
  if (!project_dir) { addMsg('system', 'Paste an engagement folder path first.'); return; }
  clearPrompt();
  document.getElementById('chat').innerHTML = '';
  setBusy(true, 'Opening project…');
  try {
    const res = await fetch('/api/project', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({project_dir})
    });
    const j = await res.json();
    if (!j.ok) { addMsg('assistant', j.error || 'Failed to open project', { error: true }); return; }
    addMsg('assistant', `Working in ${j.project_dir}`);
  } finally {
    setBusy(false);
  }
  await sendRaw('start');
}

async function sendChoice(value, label) {
  if (busy) return;
  clearPrompt();
  await sendRaw(value, label);
}

async function sendMessage() {
  if (busy) return;
  const message = document.getElementById('message').value.trim();
  if (!message) return;
  document.getElementById('message').value = '';
  clearPrompt();
  await sendRaw(message);
}

async function sendRaw(message, displayLabel) {
  const project_dir = document.getElementById('projectDir').value.trim();
  addMsg('user', displayLabel || message);
  setBusy(true, 'Working…');
  try {
  const res = await fetch('/api/chat', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({message, project_dir})
  });
  const j = await res.json();
  if (!j.ok) {
      addMsg(j.busy ? 'system' : 'assistant', j.error || 'request failed', { error: true });
    return;
  }
  addMsg('assistant', j.reply);
    if (j.activity) renderActivity(j.activity);
    renderPrompt(j.prompt);
  } catch (err) {
    addMsg('assistant', `Error: ${err}`, { error: true });
  } finally {
    setBusy(false);
  }
}

document.getElementById('message').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

window.addEventListener('load', async () => {
  // Drop cookie-backed chat on refresh so a restart/reload never resurrects an old thread.
  try {
    await fetch('/api/reset', { method: 'POST' });
  } catch (_) { /* ignore */ }
  document.getElementById('chat').innerHTML = '';
  clearPrompt();
});
</script>
